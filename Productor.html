<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Área del Productor | GastroRutas HN</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="index.html#contacto">Contacto</a>
    </nav>
</header>

<section class="producer-section">
    <div class="producer-container">

        <div class="producer-intro">
            <span class="tag">Área Privada</span>
            <h2>Panel del Productor</h2>
            <p>
                Gestiona tu perfil, fortalece tu visibilidad digital
                y conecta directamente con turistas interesados en tu experiencia.
            </p>
        </div>

        <div class="producer-card">

            <div class="login-box">
                <h3>Iniciar Sesión</h3>
                <form>
                    <input type="email" placeholder="Correo electrónico" required>
                    <input type="password" placeholder="Contraseña" required>
                    <button type="submit">Ingresar</button>
                </form>
            </div>

            <div class="profile-box">
                <h3>Crear / Editar Perfil</h3>
                <form>
                    <label>Logo del Emprendimiento</label>
                    <input type="file" accept="image/*">

                    <label>Nombre del Emprendimiento</label>
                    <input type="text" placeholder="Nombre del emprendimiento">

                    <label>Descripción Breve</label>
                    <textarea rows="4" placeholder="Describe tu historia, tu producto y tu comunidad..."></textarea>

                    <button type="submit" class="btn">Guardar Información</button>
                </form>
            </div>

        </div>
    </div>
</section>

</body>
</html>
